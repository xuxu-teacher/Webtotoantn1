<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soạn Kế Hoạch Bài Dạy — Năng lực số & AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      MathJax (component gộp tex-mml-chtml): nhận cả input MathML (từ công thức
      OMML gốc, quy đổi ở src/utils/mathToMathml.ts) lẫn input TeX ($...$ do AI
      viết thêm nếu có) và render ra HTML/CSS đúng chuẩn toán học.
    -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true,
        },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
    <style>
      /* Công thức dài tự cuộn trong khung, không bao giờ đẩy vỡ bố cục trang */
      mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
      mjx-container[display='true'] { margin: 0.5em 0 !important; }
      html, body, #root { overflow-x: hidden; }
      img { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
